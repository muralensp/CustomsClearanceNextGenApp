name: CI

# Day 11 (Phase -1) CI pipeline: build, lint, unit test stages.
# Day 12 adds: static analysis (SonarAnalyzer.CSharp, solution-wide via
# Directory.Build.props - surfaces as Build-step warnings, no separate job
# needed) and coverage gates (per-project thresholds via coverlet.msbuild,
# enforced inside build/scripts/test.sh - dotnet test fails outright if a
# project's coverage falls below its own declared threshold).
#
# Deliberately thin: all real logic lives in build/scripts/*.sh so this
# workflow can be re-hosted on Azure Pipelines later (per user decision)
# with minimal translation - only the orchestration/trigger syntax changes,
# not the build/lint/test steps themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: bash build/scripts/build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: '**/bin/Release/**'
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Lint
        run: bash build/scripts/lint.sh

  test:
    name: Unit Tests + Coverage Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # No separate "Build" step here: test.sh's `dotnet test` builds itself.
      # coverlet.msbuild hooks its instrumentation into that build step -
      # reusing a prior --no-build output silently skips instrumentation
      # (verified locally, Day 12). Test/coverage failure (including a
      # project falling below its declared threshold) fails this job.
      - name: Test (with coverage gate)
        run: bash build/scripts/test.sh

      - name: Upload test results and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
