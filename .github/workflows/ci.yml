name: CI

# Day 11 (Phase -1) CI pipeline: build, lint, unit test stages.
# Day 12 adds: static analysis (SonarAnalyzer.CSharp, solution-wide via
# Directory.Build.props - surfaces as Build-step warnings, no separate job
# needed) and coverage gates (per-project thresholds via coverlet.msbuild,
# enforced inside build/scripts/test.sh - dotnet test fails outright if a
# project's coverage falls below its own declared threshold).
# Day 13 adds: a containerize + docker-compose smoke-test stage (CD
# mechanism only - no persistently hosted "dev environment" yet; that's a
# Phase 0/Day 21 infra decision, per ADR-0008).
# Day 14 adds: three isolated test-automation layers - unit (test.sh,
# scoped to tests/Unit/** only), integration (integration-test.sh, in-process
# via WebApplicationFactory, scoped to tests/Integration/**), and API
# contract tests (contract-test.sh, Postman/Newman against the running
# docker-compose dev environment, black-box over real HTTP).
#
# Day 40 adds: an end-to-end smoke-test job (e2e-smoke-test.sh) - one
# sequential pass over auth -> gateway -> sample service -> rules engine ->
# audit -> notification against the real docker-compose environment, with an
# evidence file uploaded as a build artifact. Kept in lockstep with
# build/azure-pipelines.yml (ADR-0005).
#
# Day 43 adds (ADR-0038): dependency-scan.sh (SCA), secret-scan.sh (gitleaks,
# full history) and a final aggregate job named "CI passed" - the ONE stable
# check name branch protection requires (docs/BRANCH-PROTECTION.md). CodeQL
# (SAST) lives in its own workflow, .github/workflows/codeql.yml, and has no
# Azure Pipelines equivalent - a deliberate lockstep exception, see ADR-0038.
#
# Deliberately thin: all real logic lives in build/scripts/*.sh so this
# workflow can be re-hosted on Azure Pipelines later (per user decision)
# with minimal translation - only the orchestration/trigger syntax changes,
# not the build/lint/test steps themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: bash build/scripts/build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: '**/bin/Release/**'
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Lint
        run: bash build/scripts/lint.sh

  test:
    name: Unit Tests + Coverage Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # No separate "Build" step here: test.sh's `dotnet test` builds itself.
      # coverlet.msbuild hooks its instrumentation into that build step -
      # reusing a prior --no-build output silently skips instrumentation
      # (verified locally, Day 12). Test/coverage failure (including a
      # project falling below its declared threshold) fails this job.
      - name: Test (with coverage gate)
        run: bash build/scripts/test.sh

      - name: Upload test results and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Integration tests (WebApplicationFactory, in-process)
        run: bash build/scripts/integration-test.sh

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/
          retention-days: 7

  containerize:
    name: Containerize + Dev Environment Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test dev environment (docker compose)
        run: bash build/scripts/smoke-test.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

  contract-test:
    name: API Contract Tests (Postman/Newman)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build dev environment and run contract tests (Newman)
        run: |
          mkdir -p TestResults
          bash build/scripts/contract-test.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: TestResults/newman-results.xml
          retention-days: 7

  e2e-smoke-test:
    name: End-to-End Smoke Test (auth > gateway > rules > audit > notification)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run end-to-end smoke test (docker compose)
        run: |
          mkdir -p TestResults
          bash build/scripts/e2e-smoke-test.sh

      - name: Upload end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-evidence
          path: TestResults/e2e-evidence.txt
          retention-days: 7

  dependency-scan:
    name: Dependency Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Fails on High/Critical advisories (direct or transitive); Moderate/Low
      # are printed as warnings. Exceptions: build/dependency-scan-allowlist.txt.
      - name: Dependency vulnerability scan
        run: bash build/scripts/dependency-scan.sh

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: TestResults/dependency-scan.json
          retention-days: 7

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history - the scan covers every commit, not just the tip

      - name: Secret scan (full history)
        run: bash build/scripts/secret-scan.sh

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: TestResults/gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

  # Single aggregate check for branch protection. Runs even when a needed job
  # failed or was cancelled (if: always()) and turns ANY result other than
  # "success" - failure, cancelled, or skipped (every gating job is
  # unconditional, so "skipped" can only mean an upstream failure) - into a
  # failure. A skipped required check would otherwise be reported as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - build
      - lint
      - test
      - integration-test
      - containerize
      - contract-test
      - e2e-smoke-test
      - dependency-scan
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job to have succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | .key' | paste -sd, -)
          if [ -n "$bad" ]; then
            echo "::error::Gating job(s) did not succeed: $bad"
            exit 1
          fi
          echo "All gating jobs succeeded."
