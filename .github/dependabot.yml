# Day 43 (ADR-0038): automated dependency update PRs. Complements (does not
# replace) build/scripts/dependency-scan.sh, which is the merge gate.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Keep the EF Core / Npgsql / ASP.NET 8.0.x patch family moving together.
      microsoft-and-efcore:
        patterns:
          - "Microsoft.*"
          - "Npgsql*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
    ignore:
      # Major bumps are deliberate decisions (.NET 8 LTS pin, ADR-0001).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(ci)"

  - package-ecosystem: "docker"
    directory: "/src/Api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: "docker"
    directory: "/src/Gateway"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(docker)"

  # Note: image tags in docker-compose.yml (postgres, rabbitmq, grafana, ...) are
  # updated with the "docker-compose" ecosystem.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(docker)"
