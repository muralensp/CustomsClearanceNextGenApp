# Day 29 - Grafana unified alerting rule provisioning (file-based, same
# zero-manual-setup discipline as Days 26-28's datasources/dashboards).
# Evaluates the real Prometheus queries already proven in Day 27's
# dashboard - no new metrics/instrumentation needed, this day's scope is
# "alert on what Day 27/28 already made visible."
#
# No contact point/notification policy is provisioned here (confirmed with
# the user): this project has no real SMTP/webhook/Slack destination set up
# yet (ADR-0008/0015's deliberate no-cloud-hosting-decision-yet posture), so
# alerts use Grafana's built-in default contact point and are proven via
# their state (Normal/Pending/Alerting) in Grafana's own Alerting UI and API
# - not via an actual delivered notification.

apiVersion: 1

groups:
  - orgId: 1
    name: CustomsClearance Service Health
    folder: CustomsClearance
    interval: 30s
    rules:
      - uid: cc-service-down
        title: Service Down
        condition: B
        for: 30s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: 'up{job=~"customsclearance-.*"}'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: classic_conditions
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down (up == 0)"

      - uid: cc-high-error-rate
        title: High 5xx Error Rate
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) by (job)'
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: B
              type: classic_conditions
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  query:
                    params: ["A"]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} is returning 5xx responses"
