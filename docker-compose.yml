# Day 13 - local/CI "dev environment" definition. This is the environment
# CI's smoke test (build/scripts/smoke-test.sh) exercises after building the
# image, and what you can run locally with `docker compose up`.
#
# Day 18: the Api's DiagnosticsDbContext (Platform.Persistence) now
# connects to this postgres service for real, via the ConnectionStrings__
# DiagnosticsDb override below (Host=postgres, the docker-compose service
# name/DNS entry - not "localhost", which inside the api container would
# refer to itself). appsettings.Development.json's own connection string
# uses Host=localhost for the case of running the Api directly via
# `dotnet run` against docker-compose's postgres port mapping (5432:5432).
#
# Day 22: the "gateway" service is now the sole published edge (host port
# 8080), per Day6_API_Standards_v1.1.docx Section 2 ("gateway for external
# ingress only"). "api" no longer publishes a host port - it's reachable
# only on the internal compose network as http://api:8080, which the
# gateway's ReverseProxy__Clusters__api-cluster__Destinations__api-
# destination__Address override below points at.
#
# Day 24: "rabbitmq" is the real event bus (ADR-0012's anticipated swap for
# InMemoryEventBus), same Host=rabbitmq (compose DNS) vs Host=localhost
# (appsettings.Development.json, for `dotnet run` outside a container)
# split as postgres. The management UI (15672) is published for the "event
# bus operational" proof (queue/exchange visible), not required at runtime.
#
# Day 26: "loki"/"promtail"/"grafana" centralize log output. api/gateway now
# emit structured JSON to stdout (Platform.Logging's
# AddCustomsClearanceStructuredLogging); promtail scrapes every container's
# json-file log driver output via Docker service discovery (see
# observability/promtail-config.yaml) and ships it to loki; grafana comes
# pre-provisioned with loki as a datasource (observability/grafana-
# datasources.yaml) so the log view is reproducible via `docker compose up`,
# not a manual setup step. Anonymous Grafana access (below) is a dev-only
# convenience, same posture as every other LOCAL-DEV-ONLY placeholder in
# this stack - never a real security decision.
#
# Day 27: "prometheus" scrapes api/gateway's OpenTelemetry-exported
# /metrics endpoints (Platform.Observability's AddCustomsClearanceMetrics)
# per observability/prometheus.yml. Grafana gets a second datasource
# (Prometheus, alongside Loki) plus a provisioned dashboard
# (observability/dashboards/api-gateway-overview.json) - same
# zero-manual-setup provisioning discipline as Day 26.
#
# Day 28: "tempo" receives OpenTelemetry traces from api/gateway
# (Platform.Observability's AddCustomsClearanceTracing) via OTLP gRPC
# (4317), per observability/tempo.yaml. Grafana gets a third datasource
# (Tempo, alongside Loki/Prometheus) - same provisioning discipline.
# Otlp__Endpoint below points both services at Host=tempo (compose DNS);
# appsettings.Development.json's default (Host=localhost) covers `dotnet
# run` against docker-compose's tempo port mapping.

services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    image: customsclearance-gateway:dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__api-cluster__Destinations__api-destination__Address=http://api:8080/
      - Otlp__Endpoint=http://tempo:4317
    depends_on:
      - api
      - tempo

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    image: customsclearance-api:dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DiagnosticsDb=Host=postgres;Port=5432;Database=customsclearance_dev;Username=customsclearance;Password=devlocalonly
      - ConnectionStrings__IdentityDb=Host=postgres;Port=5432;Database=customsclearance_dev;Username=customsclearance;Password=devlocalonly
      - RabbitMq__HostName=rabbitmq
      - Otlp__Endpoint=http://tempo:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=customsclearance
      - POSTGRES_PASSWORD=devlocalonly
      - POSTGRES_DB=customsclearance_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    # Day 18 fix: without this, "depends_on: - postgres" only waits for the
    # container to START, not for Postgres to finish its first-time init
    # (which involves an internal restart cycle) and actually accept
    # connections. The Api crashed on startup hitting exactly that race -
    # found via a real smoke-test failure, not assumed. condition:
    # service_healthy makes the Api wait for this healthcheck to pass first.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customsclearance -d customsclearance_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      # Dev-only convenience (no login screen) - not a production posture.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards-provider.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - loki
      - prometheus
      - tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.5.0
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "4317:4317"
      - "3200:3200"

volumes:
  postgres-dev-data:
