# Azure DevOps pipeline - PARKED, not active.
#
# Per the user's decision (Day 11): start on GitHub Actions (.github/workflows/ci.yml),
# migrate to Azure DevOps later in the project. This file exists now, alongside the
# GitHub Actions workflow, to prove the portability claim rather than just asserting it:
# both files orchestrate the exact same build/scripts/*.sh - only trigger/job syntax
# differs. When migration happens, this file is activated in Azure DevOps and
# .github/workflows/ci.yml is retired; no changes to build/scripts/* are needed.
#
# Not registered as an active pipeline anywhere yet - kept here for when the migration
# decision is made.
#
# Day 13 adds the Containerize stage (docker-compose smoke test) - kept in
# lockstep with .github/workflows/ci.yml per ADR-0005's discipline requirement.
# Day 14 adds IntegrationTest and ContractTest stages, likewise kept in lockstep.
# Day 40 adds the E2ESmokeTest stage (e2e-smoke-test.sh), likewise kept in lockstep.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
          - bash: build/scripts/build.sh
            displayName: 'Build'
          - publish: '$(System.DefaultWorkingDirectory)'
            artifact: build-output

  - stage: Lint
    dependsOn: Build
    jobs:
      - job: Lint
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
          - bash: dotnet restore
            displayName: 'Restore'
          - bash: build/scripts/lint.sh
            displayName: 'Lint'

  - stage: Test
    dependsOn: Build
    jobs:
      - job: Test
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
          # No separate "Build" step: test.sh's `dotnet test` builds itself.
          # coverlet.msbuild's instrumentation hooks into that build step -
          # see the matching comment in .github/workflows/ci.yml (Day 12).
          - bash: build/scripts/test.sh
            displayName: 'Test (with coverage gate)'
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/TestResults/*.trx'
          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: '**/TestResults/**/coverage.cobertura.xml'

  - stage: IntegrationTest
    dependsOn: Build
    jobs:
      - job: IntegrationTest
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
          - bash: build/scripts/integration-test.sh
            displayName: 'Integration tests (WebApplicationFactory, in-process)'
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/TestResults/*.trx'

  - stage: Containerize
    dependsOn: Build
    jobs:
      - job: ContainerizeAndSmokeTest
        steps:
          - bash: build/scripts/smoke-test.sh
            displayName: 'Build and smoke-test dev environment (docker compose)'
          - bash: docker compose logs
            condition: failed()
            displayName: 'Dump container logs on failure'

  - stage: ContractTest
    dependsOn: Build
    jobs:
      - job: ContractTest
        steps:
          - bash: |
              mkdir -p TestResults
              build/scripts/contract-test.sh
            displayName: 'Build dev environment and run contract tests (Newman)'
          - bash: docker compose logs
            condition: failed()
            displayName: 'Dump container logs on failure'
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/TestResults/newman-results.xml'

  - stage: E2ESmokeTest
    dependsOn: Build
    jobs:
      - job: E2ESmokeTest
        steps:
          - bash: |
              mkdir -p TestResults
              build/scripts/e2e-smoke-test.sh
            displayName: 'End-to-end smoke test (auth > gateway > rules > audit > notification)'
          - bash: docker compose logs
            condition: failed()
            displayName: 'Dump container logs on failure'
          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: 'TestResults/e2e-evidence.txt'
              artifact: 'e2e-smoke-evidence'
